<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARISAN WK | Wanita Keadilan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Khusus layar login -- tidak masuk styles.css karena bukan bagian
       design system komponen umum, murni layout halaman ini. */
    #login-loading, #login-error { display: none; margin-top: var(--space-4); }
    #login-error { color: var(--status-danger); font-size: var(--fs-small); }
  </style>
</head>
<body>

  <!-- Header & footer khusus cetak — hanya tampil saat Print/Save as PDF
       (lihat aturan @media print di styles.css). Diisi JS sebelum window.print(). -->
  <div id="print-header">
    <div class="print-brand-row">
      <img src="assets/pks.png" alt="Logo PKS" class="print-logo">
      <div>
        <div class="app-name">ARISAN WK</div>
        <div class="print-brand-subtitle">Wanita Keadilan</div>
      </div>
    </div>
    <div class="report-title" id="print-report-title"></div>
    <div class="meta" id="print-report-meta"></div>
  </div>

  <!-- Layar login -- ditampilkan sebelum ada sesi valid -->
  <div id="login-screen" class="no-print">
    <div class="login-card">
      <div class="login-brand">
        <img src="assets/pks.png" alt="Logo" class="login-logo">
        <div>
          <h1>ARISAN WK</h1>
          <div class="brand-subtitle">Wanita Keadilan</div>
        </div>
      </div>
      <p class="text-muted login-tagline">Aplikasi Simpan Pinjam &middot; Masuk dengan akun Google Anda.</p>
      <div id="google-signin-button" style="display:flex; justify-content:center; margin-top: var(--space-4);"></div>
      <div id="login-loading" class="text-small text-muted">Memeriksa sesi...</div>
      <div id="login-error"></div>
    </div>
  </div>

  <!-- Shell aplikasi -- ditampilkan setelah login berhasil (lihat auth.js onLoginSuccess) -->
  <div class="app-shell" id="app-shell" style="display:none;">
    <nav class="sidebar no-print" id="sidebar-nav" aria-label="Navigasi utama"></nav>
    <div class="sidebar-backdrop no-print" id="sidebar-backdrop"></div>

    <div class="main-col">
      <header class="header no-print">
        <button class="mobile-menu-btn" id="mobile-menu-btn" type="button" aria-label="Buka menu" aria-expanded="false"></button>
        <div class="page-title" id="page-title">Dashboard</div>
        <div class="header-right">
          <button class="mobile-search-btn" id="mobile-search-btn" type="button" aria-label="Buka pencarian" aria-expanded="false">
            <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </button>
          <div class="search" id="global-search-box">
            <svg class="icon icon-sm search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input class="input" id="global-search-input" type="search" placeholder="Cari anggota, pinjaman, transaksi..." aria-label="Pencarian global" autocomplete="off">
            <div class="global-search-results" id="global-search-results" role="listbox" aria-label="Hasil pencarian"></div>
          </div>
          <div class="user-chip" id="header-user-chip"></div>
        </div>
      </header>

      <main class="content" id="content-area">
        <div class="empty-state">
          <p>Halaman konten akan diisi mulai STEP 4.4 (Dashboard) -- lihat catatan progres.</p>
        </div>
      </main>
    </div>
  </div>

  <div id="print-footer">
    <span id="print-footer-text"></span>
  </div>

  <script src="https://accounts.google.com/gsi/client" defer></script>
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="icons.js"></script>
  <script src="views.js"></script>
  <script src="app.js"></script>
</body>
</html>
