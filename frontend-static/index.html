<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simpan Pinjam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Khusus layar login -- tidak masuk styles.css karena bukan bagian
       design system komponen umum, murni layout halaman ini. */
    #login-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: var(--space-4); background: var(--color-surface);
    }
    #login-screen .login-card {
      background: var(--color-card); border: 1px solid var(--color-border); border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm); padding: var(--space-8); text-align: center; width: 360px; max-width: calc(100vw - 32px);
    }
    #login-loading, #login-error { display: none; margin-top: var(--space-4); }
    #login-error { color: var(--status-danger); font-size: var(--fs-small); }
  </style>
</head>
<body>

  <!-- Header & footer khusus cetak — hanya tampil saat Print/Save as PDF
       (lihat aturan @media print di styles.css). Diisi JS sebelum window.print(). -->
  <div id="print-header">
    <div class="app-name">Simpan Pinjam TVRI</div>
    <div class="report-title" id="print-report-title"></div>
    <div class="meta" id="print-report-meta"></div>
  </div>

  <!-- Layar login -- ditampilkan sebelum ada sesi valid -->
  <div id="login-screen" class="no-print">
    <div class="login-card">
      <h1>Simpan Pinjam</h1>
      <p class="text-muted">Masuk dengan akun Google kantor Anda.</p>
      <div id="google-signin-button" style="display:flex; justify-content:center; margin-top: var(--space-4);"></div>
      <div id="login-loading" class="text-small text-muted">Memeriksa sesi...</div>
      <div id="login-error"></div>
    </div>
  </div>

  <!-- Shell aplikasi -- ditampilkan setelah login berhasil (lihat auth.js onLoginSuccess) -->
  <div class="app-shell" id="app-shell" style="display:none;">
    <nav class="sidebar no-print" id="sidebar-nav" aria-label="Navigasi utama"></nav>
    <div class="sidebar-backdrop no-print" id="sidebar-backdrop"></div>

    <div class="main-col">
      <header class="header no-print">
        <button class="mobile-menu-btn" id="mobile-menu-btn" type="button" aria-label="Buka menu" aria-expanded="false">☰</button>
        <div class="page-title" id="page-title">Dashboard</div>
        <div class="header-right">
          <div class="search">
            <input class="input" type="search" placeholder="Cari anggota, pinjaman..." aria-label="Pencarian global">
          </div>
          <div class="user-chip" id="header-user-chip"></div>
        </div>
      </header>

      <main class="content" id="content-area">
        <div class="empty-state">
          <p>Halaman konten akan diisi mulai STEP 4.4 (Dashboard) -- lihat catatan progres.</p>
        </div>
      </main>
    </div>
  </div>

  <div id="print-footer">
    <span id="print-footer-text"></span>
  </div>

  <script src="https://accounts.google.com/gsi/client" defer></script>
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="views.js"></script>
  <script src="app.js"></script>
</body>
</html>
