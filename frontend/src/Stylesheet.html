<style>
  /* ============================================================
     Design tokens — Aplikasi Simpan Pinjam
     STEP 4.1. Lihat Tahap4_Frontend_Perencanaan.md untuk rasional.
     ============================================================ */
  :root {
    /* Warna */
    --color-ink: #1B2430;
    --color-muted: #5B6472;
    --color-surface: #F6F7F9;
    --color-card: #FFFFFF;
    --color-border: #E3E6EB;
    --color-primary: #1E5C4A;
    --color-primary-hover: #164A3B;
    --color-primary-soft: #E6EFEC;

    --status-success: #1E7F4E;
    --status-success-soft: #E6F4EC;
    --status-warning: #B7791F;
    --status-warning-soft: #FBF1E1;
    --status-danger: #B42318;
    --status-danger-soft: #FBEAE9;
    --status-info: #2C5AA0;
    --status-info-soft: #E9EFF8;

    /* Tipografi */
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --fs-h1: 24px;
    --fs-h2: 20px;
    --fs-h3: 16px;
    --fs-body: 14px;
    --fs-small: 12px;

    /* Spacing (skala 4px) */
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --space-8: 32px;

    /* Radius & shadow */
    --radius-sm: 4px;
    --radius-md: 8px;
    --shadow-sm: 0 1px 2px rgba(27, 36, 48, 0.06);
    --shadow-md: 0 8px 24px rgba(27, 36, 48, 0.12);

    /* Breakpoint (dipakai lewat JS/media query manual) */
    --bp-tablet: 768px;
    --bp-desktop: 1024px;

    --sidebar-width: 240px;
    --header-height: 56px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    font-family: var(--font-sans);
    font-size: var(--fs-body);
    color: var(--color-ink);
    background: var(--color-surface);
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 { margin: 0 0 var(--space-2) 0; font-weight: 700; line-height: 1.3; }
  h1 { font-size: var(--fs-h1); }
  h2 { font-size: var(--fs-h2); }
  h3 { font-size: var(--fs-h3); font-weight: 600; }
  p { margin: 0 0 var(--space-2) 0; }
  .text-muted { color: var(--color-muted); }
  .text-small { font-size: var(--fs-small); }

  /* Angka nominal: selalu tabular & rata kanan di tabel */
  .amount {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    white-space: nowrap;
  }

  a { color: var(--color-primary); }

  /* Fokus terlihat jelas di mana pun (§44 Aksesibilitas) */
  a:focus-visible, button:focus-visible, input:focus-visible,
  select:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--color-primary);
    outline-offset: 2px;
  }

  /* ---------------- Button ---------------- */
  .btn {
    font-family: var(--font-sans);
    font-size: var(--fs-body);
    font-weight: 600;
    padding: var(--space-2) var(--space-4);
    border-radius: var(--radius-md);
    border: 1px solid transparent;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    transition: background-color 0.12s ease, opacity 0.12s ease;
  }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .btn-primary { background: var(--color-primary); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--color-primary-hover); }
  .btn-secondary { background: var(--color-card); color: var(--color-ink); border-color: var(--color-border); }
  .btn-secondary:hover:not(:disabled) { background: var(--color-surface); }
  .btn-danger { background: var(--status-danger); color: #fff; }
  .btn-danger:hover:not(:disabled) { background: #921C13; }
  .btn-ghost { background: transparent; color: var(--color-primary); }
  .btn-ghost:hover:not(:disabled) { background: var(--color-primary-soft); }
  .btn-block { width: 100%; justify-content: center; }

  /* ---------------- Input / Select ---------------- */
  label { display: block; font-weight: 600; font-size: var(--fs-small); margin-bottom: var(--space-1); }
  label .required { color: var(--status-danger); margin-left: 2px; }
  .input, .select, textarea {
    width: 100%;
    font-family: var(--font-sans);
    font-size: var(--fs-body);
    color: var(--color-ink);
    background: var(--color-card);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    padding: var(--space-2) var(--space-3);
  }
  .input:focus, .select:focus, textarea:focus { border-color: var(--color-primary); }
  .field { margin-bottom: var(--space-4); }
  .field-error { color: var(--status-danger); font-size: var(--fs-small); margin-top: var(--space-1); }
  .field.has-error .input, .field.has-error .select { border-color: var(--status-danger); }
  .currency-input { position: relative; }
  .currency-input .prefix {
    position: absolute; left: var(--space-3); top: 50%; transform: translateY(-50%);
    color: var(--color-muted); font-weight: 600; pointer-events: none;
  }
  .currency-input .input { padding-left: 34px; text-align: right; font-variant-numeric: tabular-nums; }

  /* ---------------- Card ---------------- */
  .card {
    background: var(--color-card);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
    padding: var(--space-5);
  }
  .summary-card { display: flex; flex-direction: column; gap: var(--space-1); }
  .summary-card .label { font-size: var(--fs-small); color: var(--color-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; }
  .summary-card .value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .summary-card .sub { font-size: var(--fs-small); color: var(--color-muted); }

  /* ---------------- Badge (status — selalu teks + warna) ---------------- */
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: var(--fs-small); font-weight: 700;
    padding: 3px var(--space-2); border-radius: 999px;
    white-space: nowrap;
  }
  .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge-success { background: var(--status-success-soft); color: var(--status-success); }
  .badge-warning { background: var(--status-warning-soft); color: var(--status-warning); }
  .badge-danger { background: var(--status-danger-soft); color: var(--status-danger); }
  .badge-info { background: var(--status-info-soft); color: var(--status-info); }
  .badge-neutral { background: var(--color-surface); color: var(--color-muted); }

  /* ---------------- Alert ---------------- */
  .alert { display: flex; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); border: 1px solid transparent; font-size: var(--fs-body); }
  .alert-success { background: var(--status-success-soft); color: var(--status-success); border-color: var(--status-success); }
  .alert-warning { background: var(--status-warning-soft); color: var(--status-warning); border-color: var(--status-warning); }
  .alert-danger { background: var(--status-danger-soft); color: var(--status-danger); border-color: var(--status-danger); }
  .alert-info { background: var(--status-info-soft); color: var(--status-info); border-color: var(--status-info); }

  /* ---------------- Table ---------------- */
  .table-wrap { overflow-x: auto; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-card); }
  table.data-table { width: 100%; border-collapse: collapse; }
  table.data-table thead th {
    position: sticky; top: 0; background: var(--color-surface);
    text-align: left; font-size: var(--fs-small); font-weight: 700; color: var(--color-muted);
    text-transform: uppercase; letter-spacing: 0.02em;
    padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-border);
  }
  table.data-table td { padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-border); font-size: var(--fs-body); }
  table.data-table tbody tr:hover { background: var(--color-surface); }
  table.data-table td.col-amount, table.data-table th.col-amount { text-align: right; }

  /* ---------------- Modal ---------------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(27, 36, 48, 0.5);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  .modal {
    background: var(--color-card); border-radius: var(--radius-md); box-shadow: var(--shadow-md);
    width: 420px; max-width: calc(100vw - 32px); padding: var(--space-6);
  }
  .modal h2 { margin-bottom: var(--space-4); }
  .modal-actions { display: flex; justify-content: flex-end; gap: var(--space-3); margin-top: var(--space-6); }

  /* ---------------- Empty state ---------------- */
  .empty-state { text-align: center; padding: var(--space-8) var(--space-4); color: var(--color-muted); }

  /* ---------------- Layout: Sidebar + Header ---------------- */
  .app-shell { display: flex; min-height: 100vh; }
  .sidebar {
    width: var(--sidebar-width); flex-shrink: 0; background: var(--color-ink); color: #fff;
    display: flex; flex-direction: column; padding: var(--space-4) 0;
  }
  .sidebar .brand { padding: 0 var(--space-4) var(--space-4); font-weight: 700; font-size: var(--fs-h3); border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: var(--space-3); }
  .sidebar .group-label { padding: var(--space-3) var(--space-4) var(--space-1); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: rgba(255,255,255,0.45); font-weight: 700; }
  .sidebar a.nav-item {
    display: block; padding: var(--space-2) var(--space-4); color: rgba(255,255,255,0.85);
    text-decoration: none; font-size: var(--fs-body); border-left: 3px solid transparent;
  }
  .sidebar a.nav-item:hover { background: rgba(255,255,255,0.06); }
  .sidebar a.nav-item.active { background: rgba(255,255,255,0.1); border-left-color: var(--color-primary-soft); font-weight: 600; color: #fff; }

  .main-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .header {
    height: var(--header-height); background: var(--color-card); border-bottom: 1px solid var(--color-border);
    display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-5); flex-shrink: 0;
  }
  .header .page-title { font-weight: 700; font-size: var(--fs-h3); }
  .header .header-right { display: flex; align-items: center; gap: var(--space-4); }
  .header .search input { width: 220px; }
  .header .user-chip { display: flex; align-items: center; gap: var(--space-2); font-size: var(--fs-small); }
  .header .user-chip .role { color: var(--color-muted); }

  .content { padding: var(--space-6); flex: 1; }
  .content-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-5); }

  /* ---------------- Responsive ---------------- */
  @media (max-width: 1023px) {
    .sidebar { width: 64px; }
    .sidebar .brand, .sidebar .group-label, .sidebar a.nav-item span.label { display: none; }
  }
  @media (max-width: 767px) {
    .app-shell { flex-direction: column; }
    .sidebar { width: 100%; height: auto; flex-direction: row; overflow-x: auto; padding: var(--space-2); }
    .sidebar .brand, .sidebar .group-label { display: none; }
    .sidebar a.nav-item { white-space: nowrap; border-left: none; border-bottom: 3px solid transparent; }
    .sidebar a.nav-item.active { border-bottom-color: var(--color-primary-soft); }
    .header .search { display: none; }
    .content { padding: var(--space-4); }
    .btn-block-mobile { width: 100%; }
    /* Tabel -> card list di mobile (lihat pola markup di JavaScript.html) */
    table.data-table thead { display: none; }
    table.data-table, table.data-table tbody, table.data-table tr, table.data-table td { display: block; width: 100%; }
    table.data-table tr { border-bottom: 8px solid var(--color-surface); padding: var(--space-3) var(--space-4); }
    table.data-table td { border-bottom: none; padding: var(--space-1) 0; display: flex; justify-content: space-between; gap: var(--space-3); }
    table.data-table td::before { content: attr(data-label); font-weight: 600; color: var(--color-muted); font-size: var(--fs-small); }
  }
</style>
